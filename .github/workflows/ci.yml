name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: node dist/cli.js doctor

  cross-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - uses: denoland/setup-deno@v3
        with:
          deno-version: v2.x
      - uses: oven-sh/setup-bun@v3
        with:
          bun-version: latest
      - run: npm ci
      - run: npm run build
      - run: node dist/cli.js doctor
      - run: deno run --allow-read --allow-write --allow-env --allow-run=git src/cli.ts doctor
      - run: bun run src/cli.ts doctor
